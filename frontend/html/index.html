<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta charset="utf-8">
	<title>XHR Chat</title>
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
	<h1 class="center">XHR chat</h1>
	<div id="settings-box">
		<span>Your nickname: </span><span id="info-user"></span>
		<br>
		<span>Chatting with: </span><span id="info-stranger"></span>
		<br>
		<br>
		<label for="user">Nickname: </label><input type="text" id="user" onfocusout="set_user()">
		<br>
		<label for="stranger">Chat with: </label><input type="text" id="stranger" onfocusout="set_stranger()">
		<br>
		<label>Connection mode: </label><br>
		<input type="radio" id="poll" name="mode" value="POLL" onclick="set_mode()">
		<label for="poll">Polling</label><br>
		<input type="radio" id="long_polling" name="mode" value="LONG POLL" onclick="set_mode()" checked>
		<label for="long_polling">Long polling</label><br>
		<input type="radio" id="websocket" name="mode" value="WEBSOCKET" onclick="set_mode()">
		<label for="websocket">Websocket</label>
	</div>

	<div id="fail-box"></div>
	<div id="chat-box"></div>
	<div id="send">
		<input type="text" id="send-box" onKeyDown="if(event.keyCode==13) send_msg();">
		<button id="send-btn" onclick="send_msg()">send</button>
	</div>

	<script src="js/script.js"></script>
</body>
</html>
